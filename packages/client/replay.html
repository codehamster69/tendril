<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F2C31" />
    <title>Tendril · replay</title>
    <style>
      :root { color-scheme: dark; --bg: #0F2C31; --ink: #EAF2E3; --soft: #9DB8B0; --line: #24474C; --gold: #FFD66A; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, sans-serif; }
      body { display: flex; flex-direction: column; }
      header.bar { display: flex; gap: 12px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); }
      header.bar a { color: var(--ink); text-decoration: none; font-weight: 700; }
      header.bar .meta { color: var(--soft); flex: 1; }
      main { flex: 1; display: grid; grid-template-columns: 1fr; min-height: 0; }
      main.race { grid-template-columns: 1fr 1fr; }
      .pane { display: flex; flex-direction: column; min-width: 0; min-height: 260px; border-right: 1px solid var(--line); }
      .pane:last-child { border-right: 0; }
      .pane-head { display: flex; justify-content: space-between; gap: 8px; padding: 6px 12px; }
      .pane-worth { color: var(--gold); font-weight: 700; font-variant-numeric: tabular-nums; }
      .stage { position: relative; flex: 1; background: #9EBB8E; min-height: 200px; }
      .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #sealed { margin: auto; text-align: center; padding: 32px 16px; max-width: 28rem; }
      #sealed h1 { margin: 0 0 8px; font-size: 1.3rem; }
      #error { margin: auto; padding: 32px 16px; color: var(--soft); }
      footer.controls { display: flex; gap: 10px; align-items: center; padding: 8px 16px; border-top: 1px solid var(--line); }
      footer.controls input[type=range] { flex: 1; min-width: 0; }
      footer.controls button, footer.controls select { background: #1b4147; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; font: inherit; }
      #clock { font-variant-numeric: tabular-nums; color: var(--soft); min-width: 7.5em; text-align: right; }
      body.embed header.bar { display: none; }
      [hidden] { display: none !important; }
      @media (max-width: 640px) { main.race { grid-template-columns: 1fr; grid-auto-rows: 1fr; } .pane { border-right: 0; border-bottom: 1px solid var(--line); } }
    </style>
  </head>
  <body>
    <header class="bar">
      <a href="../">Tendril</a>
      <span class="meta" id="meta">Loading replay…</span>
      <a id="play-link" href="./?mode=daily">Play it yourself</a>
    </header>
    <main id="panes">
      <section class="pane" id="pane-a" hidden>
        <div class="pane-head"><span class="pane-name"></span><span>Net worth <span class="pane-worth" data-testid="worth-a">0</span></span></div>
        <div class="stage"><canvas aria-label="Replayed farm"></canvas></div>
      </section>
      <section class="pane" id="pane-b" hidden>
        <div class="pane-head"><span class="pane-name"></span><span>Net worth <span class="pane-worth" data-testid="worth-b">0</span></span></div>
        <div class="stage"><canvas aria-label="Replayed farm, second run"></canvas></div>
      </section>
      <div id="sealed" hidden role="status"><h1>Sealed until the challenge closes</h1><p id="sealed-note"></p></div>
      <div id="error" hidden role="alert"></div>
    </main>
    <footer class="controls" id="controls" hidden>
      <button id="btn-play" type="button">Play</button>
      <input id="scrub" type="range" min="0" max="3000" value="0" step="1" aria-label="Scrub through the run" />
      <select id="speed" aria-label="Speed"><option value="1">1×</option><option value="4" selected>4×</option><option value="16">16×</option><option value="64">64×</option></select>
      <span id="clock">tick 0 / 0</span>
    </footer>
    <script type="module" src="/src/replay-main.ts"></script>
  </body>
</html>
