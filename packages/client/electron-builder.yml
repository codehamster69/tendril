appId: com.tendril.game
productName: Tendril
asar: true
npmRebuild: false
forceCodeSigning: false
# Vite bundles the renderer's libraries into dist/, so they are devDependencies.
# The only production dependency is electron-updater, which the main process
# loads at runtime; electron-builder copies it (and only it) into node_modules.
# dist/ holds index.html, assets/ (chunks, workers) and models/*.glb served via app://tendril/.
files:
  - dist/**/*
  - electron/*.cjs
  - '!electron/*.test.cjs'
  - '!**/*.map'
  - '!**/.env*'
extraMetadata:
  main: electron/main.cjs
  description: A farming game powered by player-written Sprout programs.
  author: Tendril
directories:
  output: release
  buildResources: build
artifactName: '${productName}-${version}-${os}-${arch}.${ext}'
# Builds never publish (electron:pack passes --publish never; the release
# workflow uploads files). This entry makes electron-builder write the
# latest*.yml files that electron-updater reads from each GitHub release.
publish:
  provider: github
  owner: codehamster69
  repo: tendril
  releaseType: release
mac:
  category: public.app-category.games
  identity: null
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
win:
  signAndEditExecutable: false
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  executableName: tendril
  category: Game
  maintainer: Tendril <175239922+codehamster69@users.noreply.github.com>
  synopsis: Tendril farming game
  description: A farming game powered by player-written Sprout programs.
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
