appId: com.tendril.game
productName: Tendril
asar: true
npmRebuild: false
forceCodeSigning: false
# Vite bundles all runtime dependencies into dist/, so no node_modules ship.
# dist/ holds index.html, assets/ (chunks, workers) and models/*.glb served via app://tendril/.
files:
  - dist/**/*
  - electron/*.cjs
  - '!electron/*.test.cjs'
  - '!**/*.map'
  - '!node_modules/**/*'
  - '!**/node_modules/**'
  - '!**/.env*'
extraMetadata:
  main: electron/main.cjs
  description: A farming game powered by player-written Sprout programs.
  author: Tendril
directories:
  output: release
  buildResources: build
artifactName: '${productName}-${version}-${os}-${arch}.${ext}'
publish: null
mac:
  category: public.app-category.games
  identity: null
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
win:
  signAndEditExecutable: false
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  executableName: tendril
  category: Game
  maintainer: Tendril
  synopsis: Tendril farming game
  description: A farming game powered by player-written Sprout programs.
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
