name: Unsigned desktop installers

on:
  workflow_dispatch:
  # The monthly release calls this with the tag it just pushed (a push made with
  # the workflow token does not start a tag workflow by itself).
  workflow_call:
    inputs:
      tag:
        description: 'Tag to build and publish, for example v0.2.1 (empty: build main only)'
        type: string
        default: ''
      publish:
        description: 'Publish a GitHub Release for the tag'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: unsigned-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installers:
    name: Package ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-arm64
            os: macos-latest
            args: --mac dmg:arm64 zip:arm64
          - name: mac-x64
            os: macos-latest
            args: --mac dmg:x64 zip:x64
          - name: win-x64
            os: windows-latest
            args: --win nsis:x64
          - name: linux-x64
            os: ubuntu-22.04
            args: --linux AppImage:x64 deb:x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CI: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}
      # No version input: pnpm/action-setup reads the root package.json packageManager field.
      - name: Install the repository's pinned pnpm
        uses: pnpm/action-setup@v6 # UNPINNED: coordinator to pin to a full SHA
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      # Models come from committed assets/export/*.glb; Blender is not needed in CI.
      - name: Copy exported models
        run: pnpm assets:copy
      - name: Build client
        run: pnpm build
      # Releases are tagged from the client version, so a tag that does not match
      # would ship update files that point at the wrong version.
      - name: Check the tag matches the client version
        if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./packages/client/package.json').version")" = "${{ inputs.tag || github.ref_name }}"
      - name: Build unsigned installers (no publishing)
        run: pnpm --filter @tendril/client run electron:pack ${{ matrix.args }}
      - name: Store installers as workflow artifacts only
        uses: actions/upload-artifact@v7 # UNPINNED: coordinator to pin to a full SHA
        with:
          name: Tendril-unsigned-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            packages/client/release/*.dmg
            packages/client/release/*.zip
            packages/client/release/*.exe
            packages/client/release/*.AppImage
            packages/client/release/*.deb
            packages/client/release/latest.yml
            packages/client/release/latest-linux.yml
            packages/client/release/*.exe.blockmap

  publish:
    name: Publish GitHub Release
    # Only a pushed v* tag or an explicit publish from the monthly release publishes.
    # A manual run (workflow_dispatch) stops at workflow artifacts.
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (inputs.publish && inputs.tag != '')
    needs: installers
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download every installer artifact
        uses: actions/download-artifact@v8 # UNPINNED: coordinator to pin to a full SHA
        with:
          pattern: Tendril-unsigned-*
          merge-multiple: true
          path: installers
      - name: Create the release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          ls -l installers
          # latest.yml (Windows) and latest-linux.yml (AppImage) drive in-app auto-update.
          # macOS builds are unsigned and cannot self-install, so latest-mac.yml is not published.
          gh release create "$TAG" installers/*.dmg installers/*.zip installers/*.exe installers/*.AppImage installers/*.deb \
            installers/latest.yml installers/latest-linux.yml installers/*.exe.blockmap \
            --title "Tendril $TAG" --generate-notes
