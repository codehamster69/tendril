name: Unsigned desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: unsigned-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installers:
    name: Package ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-arm64
            os: macos-latest
            args: --mac dmg:arm64 zip:arm64
          - name: mac-x64
            os: macos-latest
            args: --mac dmg:x64 zip:x64
          - name: win-x64
            os: windows-latest
            args: --win nsis:x64
          - name: linux-x64
            os: ubuntu-22.04
            args: --linux AppImage:x64 deb:x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CI: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # No version input: pnpm/action-setup reads the root package.json packageManager field.
      - name: Install the repository's pinned pnpm
        uses: pnpm/action-setup@v4 # UNPINNED: coordinator to pin to a full SHA
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      # Models come from committed assets/export/*.glb; Blender is not needed in CI.
      - name: Copy exported models
        run: pnpm assets:copy
      - name: Build client
        run: pnpm build
      - name: Build unsigned installers (no publishing)
        run: pnpm --filter @tendril/client run electron:pack ${{ matrix.args }}
      - name: Store installers as workflow artifacts only
        uses: actions/upload-artifact@v4 # UNPINNED: coordinator to pin to a full SHA
        with:
          name: Tendril-unsigned-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            packages/client/release/*.dmg
            packages/client/release/*.zip
            packages/client/release/*.exe
            packages/client/release/*.AppImage
            packages/client/release/*.deb

  publish:
    name: Publish GitHub Release
    # Only a pushed v* tag publishes. A manual run (workflow_dispatch) stops at workflow artifacts.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: installers
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download every installer artifact
        uses: actions/download-artifact@v4 # UNPINNED: coordinator to pin to a full SHA
        with:
          pattern: Tendril-unsigned-*
          merge-multiple: true
          path: installers
      - name: Create the release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l installers
          gh release create "$TAG" installers/*.dmg installers/*.zip installers/*.exe installers/*.AppImage installers/*.deb --title "Tendril $TAG" --generate-notes
