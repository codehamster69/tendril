name: Unsigned desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: unsigned-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installers:
    name: Validate and package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            os: macos-14
          - platform: win
            os: windows-latest
          - platform: linux
            # User namespaces work here without disabling Chromium's sandbox.
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CI: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install the repository's pinned pnpm
        uses: pnpm/action-setup@v4
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
          cache: pnpm
      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium and system dependencies
        run: pnpm --filter @tendril/client exec playwright install --with-deps chromium
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Browser E2E (no retries)
        run: pnpm test:e2e --retries=0
      - name: Electron navigation policy tests
        run: node --test packages/client/electron/navigation.test.cjs
      - name: Electron smoke (macOS and Windows)
        if: runner.os != 'Linux'
        run: pnpm --filter @tendril/client electron:smoke
      - name: Electron smoke (Linux, sandbox enabled)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm --filter @tendril/client electron:smoke
      - name: Build unsigned installers (no publishing)
        working-directory: packages/client
        run: pnpm exec electron-builder --config electron-builder.yml --${{ matrix.platform }} --publish never
      - name: Store installers as GitHub workflow artifacts only
        uses: actions/upload-artifact@v4
        with:
          name: Tendril-unsigned-${{ matrix.platform }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            packages/client/release/*.dmg
            packages/client/release/*.zip
            packages/client/release/*.exe
            packages/client/release/*.AppImage
            packages/client/release/*.deb
